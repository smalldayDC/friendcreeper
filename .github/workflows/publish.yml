name: Publish to Platforms

on:
  push:
    tags:
      - 'release/*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract changelog from tag
        id: tag
        run: |
          {
            echo 'message<<CHANGELOG_EOF'
            git tag -l --format='%(contents)' ${GITHUB_REF_NAME}
            echo 'CHANGELOG_EOF'
          } >> $GITHUB_OUTPUT

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and publish
        run: ./gradlew build publishMods -Pbuild.release=true -Pbuild.release.destination=MR+CF
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CHANGELOG: ${{ steps.tag.outputs.message }}
