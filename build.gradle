plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'me.modmuss50.mod-publish-plugin' version '1.1.0'
}

version = project.mod_version
group = project.maven_group

loom {
    splitEnvironmentSourceSets()

    mods {
        "friendcreeper" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

repositories {
    maven { url = 'https://maven.shedaniel.me/' }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Mod Menu — optional at runtime, required at compile time for config screen integration
    modCompileOnly("com.terraformersmc:modmenu:${project.modmenu_version}")
    modLocalRuntime("com.terraformersmc:modmenu:${project.modmenu_version}")

    // Cloth Config — optional at runtime, required at compile time for config screen
    modCompileOnly("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    modLocalRuntime("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    // Jade — optional at runtime, required at compile time for tooltip integration
    modCompileOnly("maven.modrinth:jade:${project.jade_version}")
    modLocalRuntime("maven.modrinth:jade:${project.jade_version}")
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
    it.options.encoding = "UTF-8"
}

jar {
    from('LICENSE') {
        rename { "${it}_${base.archivesName.get()}" }
    }
}

processResources {
    def modVersion = project.version
    inputs.property('version', modVersion)
    filteringCharset = 'UTF-8'
    filesMatching('fabric.mod.json') {
        expand(['version': modVersion])
    }
}

gradle.projectsEvaluated {
    publishMods {
        if (!project.hasProperty('build.release')) {
            return println('Publishing is disabled, use the CI workflow or pass -Pbuild.release=true')
        }

        def modVersion = project.version.toString()
        if (modVersion.contains('alpha') || modVersion.contains('beta')) {
            return println("Refusing to publish non-stable version: ${modVersion}")
        }

        changelog = providers.environmentVariable('CHANGELOG').orElse('')
        type = STABLE

        modrinth {
            accessToken = providers.environmentVariable('MODRINTH_TOKEN')
            projectId = 'zJk1s6MI'
            file = remapJar.archiveFile
            displayName = "Friend Creeper ${modVersion}"
            minecraftVersions.add(project.minecraft_version)
            modLoaders.add('fabric')
        }
    }
}
